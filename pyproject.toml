[project]
name = "teaching-layout-cli"
version = "0.1.0"
description = "Local CLI engine for print-ready teaching-aid PDF layout."
requires-python = ">=3.10"
dependencies = [
  "python-docx",
  "PyMuPDF",
  "Pillow",
  "pypdf",
  "reportlab"
]

[project.scripts]
teaching-layout = "teaching_layout.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
